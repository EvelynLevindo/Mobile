name: senai_checkin
description: "Aplicativo de registro de ponto e diário de campo com câmera e GPS."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.1
  image_picker: ^1.0.8
  path: ^1.9.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  sqflite: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
